<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Editor</title>
</head>
<body>
    <link rel="stylesheet" href="txt.css">
    <h3>Text Editor</h3>
    <textarea id="textArea" rows="10" cols="30"></textarea>

    <h4>Save & Load Slots</h4>
    <div>
        <button class="saveBtn">Save 1</button>
        <button class="loadBtn">Load 1</button>
        <button class="clearBtn">Clear 1</button>
    </div>
    <div>
        <button class="saveBtn">Save 2</button>
        <button class="loadBtn">Load 2</button>
        <button class="clearBtn">Clear 2</button>
    </div>
    <div>
        <button class="saveBtn">Save 3</button>
        <button class="loadBtn">Load 3</button>
        <button class="clearBtn">Clear 3</button>
    </div>
    <script src="popup.js"></script>
</body>
</html>
